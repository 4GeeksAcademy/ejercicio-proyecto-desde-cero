# Entorno de desarrollo reproducible. Uso: cp .env.example .env && docker compose up --build
name: tallerya

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tallerya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tallerya}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432" # solo localhost (dev)
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-tallerya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tallerya}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      # 0 = no fiarse de X-Forwarded-For (seguro). El proxy de Next NO añade esa cabecera, solo reenvía la del cliente,
      # así que con 1 un atacante podría falsificarla. Usa 1 SOLO detrás de un proxy inverso real (Nginx/Caddy/balanceador)
      # que establezca la cabecera, y sin publicar el puerto 8000.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    healthcheck:
      disable: true # el worker no sirve HTTP (el healthcheck de la imagen no aplica)
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  # Observabilidad (opcional): docker compose --profile observability up -d
  # y en .env: OTEL_ENABLED=true  OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
  lgtm:
    image: grafana/otel-lgtm:0.11.0 # Grafana + Tempo (trazas) + Prometheus (métricas) + Loki + colector OTLP
    profiles: [observability]
    ports:
      - "127.0.0.1:3001:3000" # Grafana (usuario/clave por defecto de desarrollo: admin/admin)
    networks: [internal]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025" # bandeja de correos de desarrollo
    networks: [internal]
    restart: unless-stopped

networks:
  edge: {}
  internal: {}

volumes:
  pgdata: {}
